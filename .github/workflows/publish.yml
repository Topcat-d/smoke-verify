name: publish

# Publishes the `smoke-verify` Python package to PyPI using Trusted
# Publishing (OIDC) — no API tokens are stored or used anywhere in this
# workflow. Configure the trusted publisher on PyPI for this repo/workflow
# before the first release (Project settings -> Publishing on pypi.org).
#
# Triggered only when a GitHub Release is published. Draft/pre-releases do
# not trigger a publish until you hit "Publish release".
on:
  release:
    types: [published]

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build distributions
        working-directory: python
        run: python -m build

      - name: twine check
        working-directory: python
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: python/dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/smoke-verify/
    permissions:
      id-token: write  # required for PyPI Trusted Publishing (OIDC)
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
